{% extends "layout.html" %}
{% block content %}
<h1>Balore OptiStor</h1>
<form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" required>
    <label for="password">Contrasena</label>
    <input type="password" id="password" required>
    <p class="error" id="login-error"></p>
    <button type="submit">Entrar</button>
</form>
<script>
    const SUPABASE_URL = "{{ supabase_url }}";
    const SUPABASE_ANON_KEY = "{{ supabase_anon_key }}";

    document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('login-error');
        errorEl.textContent = '';

        try {
            const resp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                method: 'POST',
                headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });
            const data = await resp.json();
            if (!resp.ok) {
                errorEl.textContent = data.msg || data.error_description || 'No se pudo iniciar sesion.';
                return;
            }
            document.cookie = `optistor_token=${data.access_token}; path=/; max-age=${data.expires_in}; SameSite=Lax`;
            window.location.href = '/app/projects';
        } catch (err) {
            errorEl.textContent = 'Error de red al iniciar sesion.';
        }
    });
</script>
{% endblock %}
