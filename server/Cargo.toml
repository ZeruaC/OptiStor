[package]
name = "optistor-server"
version = "0.1.0"
edition = "2024"
authors = ["B. Ballesteros", "M. Ballesteros", "Balore Eng"]

[dependencies]
askama = "0.16.0"
axum = "0.8.9"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
