# Fly.io app config for the Rust web shell. Adjust `app`/`primary_region`
# to whatever you actually name/place the app when you provision it —
# these are placeholders, not verified against a live account.
app = "optistor-server"
primary_region = "mad"

[build]

[env]
  OPTISTOR_DATABASE_URL = "sqlite:///data/optistor.db"
  # optistor-engine.internal resolves over Fly's private 6PN network —
  # only reachable from other apps in the same Fly org, never public.
  OPTISTOR_ENGINE_URL = "http://optistor-engine.internal:8001"
  OPTISTOR_SUPABASE_URL = "https://fyqulandxyicawmvquxg.supabase.co"

# Persistent volume for the SQLite file — create it once with:
#   fly volumes create optistor_data --size 1 --app optistor-server
[[mounts]]
  source = "optistor_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
