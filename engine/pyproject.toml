[project]
name = "optistor-engine"
version = "0.1.0"
description = "Optimization engine microservice for Balore OptiStor (GEKKO-based BESS/PV dispatch model)"
authors = [
    {name = "B. Ballesteros"},
    {name = "M. Ballesteros"},
    {name = "Balore Eng"},
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gekko>=1.0.6",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optistor_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
